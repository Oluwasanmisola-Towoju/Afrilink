<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AfriLink | Sign up</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #f1f3f5;
            --panel: rgba(255, 255, 255, 0.9);
            --ink: #102a3b;
            --muted: #6e7f90;
            --accent: #123b4f
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            font-family: "Inter", sans-serif;
            background: var(--bg);
            color: var(--ink);
            min-height: 100vh;
            display: grid;
            place-items: center
        }

        .card {
            width: min(96vw, 640px);
            background: var(--panel);
            border-radius: 18px;
            padding: 28px;
            border: 1px solid rgba(16, 32, 48, 0.06);
            box-shadow: 0 22px 40px rgba(11, 28, 38, 0.06)
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px
        }

        .brand img {
            width: 64px;
            height: auto
        }

        .brand h1 {
            margin: 0;
            font-size: 1.6rem
        }

        form {
            margin-top: 18px;
            display: grid;
            gap: 12px
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px
        }

        label {
            font-size: 0.83rem;
            color: var(--muted);
            display: block;
            margin-bottom: 6px;
            font-weight: 600
        }

        input {
            height: 48px;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid rgba(16, 32, 48, 0.08);
            font-size: 1rem
        }

        .full {
            grid-column: 1/-1
        }

        .hint {
            font-size: 0.82rem;
            color: var(--muted);
            margin-top: 6px
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 8px
        }

        .btn {
            flex: 1;
            padding: 12px 14px;
            border-radius: 10px;
            border: none;
            background: var(--accent);
            color: #fff;
            font-weight: 700;
            cursor: pointer
        }

        .btn.secondary {
            background: transparent;
            border: 1px solid rgba(16, 32, 48, 0.08);
            color: var(--ink)
        }

        .error {
            color: #b0524a;
            font-size: 0.9rem
        }

        @media(max-width:640px) {
            .row {
                grid-template-columns: 1fr
            }
        }
    </style>
</head>

<body>
    <main class="card" role="main">
        <div class="brand">
            <img src="../Assets/afrilink_logo.png" alt="AfriLink logo" />
            <div>
                <h1>Create account</h1>
                <div style="color:var(--muted);font-size:0.92rem">Join AfriLink to start trading</div>
            </div>
        </div>

        <form id="signupForm" action="/api/signup" method="post" novalidate>
            <div class="row">
                <div>
                    <label for="firstName">First name</label>
                    <input id="firstName" name="firstName" type="text" placeholder="First name" required />
                </div>
                <div>
                    <label for="surname">Surname</label>
                    <input id="surname" name="surname" type="text" placeholder="Surname" required />
                </div>
            </div>

            <div>
                <label for="business">Business name</label>
                <input id="business" name="business" type="text" placeholder="Company or trading name" required />
            </div>

            <div>
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="name@company.com" required />
            </div>

            <div class="row">
                <div>
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" placeholder="Create password" minlength="8"
                        required />
                </div>
                <div>
                    <label for="confirm">Confirm password</label>
                    <input id="confirm" name="confirm" type="password" placeholder="Confirm password" minlength="8"
                        required />
                </div>
            </div>

            <div id="error" class="error" role="alert" aria-live="polite" style="display:none"></div>

            <div class="actions">
                <button type="button" class="btn secondary" onclick="window.location.href='Login.html'">Back to Log
                    in</button>
                <button type="submit" class="btn">Create account</button>
            </div>

            <p class="hint">By creating an account you agree to our <a href="#">Terms</a> &amp; <a href="#">Privacy</a>.
            </p>
        </form>
    </main>

    <script>
        // Client-side validation and placeholder for backend integration.
        const form = document.getElementById('signupForm');
        const errorBox = document.getElementById('error');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errorBox.style.display = 'none';
            const pwd = document.getElementById('password').value.trim();
            const conf = document.getElementById('confirm').value.trim();
            if (pwd.length < 8) {
                showError('Password must be at least 8 characters.');
                return;
            }
            if (pwd !== conf) {
                showError('Passwords do not match.');
                return;
            }

            // NOTE: backend integration placeholder. The backend team should implement /api/signup
            // For now we perform a simple POST using fetch to the configured endpoint.
            const payload = {
                firstName: document.getElementById('firstName').value.trim(),
                surname: document.getElementById('surname').value.trim(),
                business: document.getElementById('business').value.trim(),
                email: document.getElementById('email').value.trim(),
                password: pwd,
            };

            fetch(form.action, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload),
            }).then(async (r) => {
                if (!r.ok) {
                    const body = await r.text();
                    showError(body || 'Failed to create account');
                    return;
                }
                // On success redirect to a dashboard or login; backend will decide exact behavior
                window.location.href = 'Login.html';
            }).catch((err) => {
                showError('Network error. Please try again.');
                console.error(err);
            });
        });

        function showError(msg) { errorBox.style.display = 'block'; errorBox.textContent = msg }
    </script>
</body>

</html>
