$kind: http-request
name: Raise Dispute
method: POST
url: '{{baseUrl}}/api/transactions/{{transactionId}}/dispute'
order: 11000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "reason": "Goods were not delivered as described."
    }
