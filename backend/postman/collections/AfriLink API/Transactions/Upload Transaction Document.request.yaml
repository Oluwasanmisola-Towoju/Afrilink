$kind: http-request
name: Upload Transaction Document
method: POST
url: '{{baseUrl}}/api/transactions/{{transactionId}}/documents'
order: 8000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "INVOICE",
      "fileUrl": "https://example.com/docs/invoice.pdf",
      "fileName": "invoice.pdf"
    }
