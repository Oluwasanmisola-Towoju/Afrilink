$kind: http-request
name: Fund Transaction
method: POST
url: '{{baseUrl}}/api/transactions/{{transactionId}}/payment'
order: 9000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "method": "bank_transfer"
    }
