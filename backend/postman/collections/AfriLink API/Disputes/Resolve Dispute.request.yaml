$kind: http-request
name: Resolve Dispute
method: POST
url: '{{baseUrl}}/api/disputes/{{disputeId}}/resolve'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "resolution": "RELEASE",
      "adminNote": "Evidence reviewed, releasing funds to seller."
    }
