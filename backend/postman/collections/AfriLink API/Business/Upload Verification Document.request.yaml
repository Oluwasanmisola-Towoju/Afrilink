$kind: http-request
name: Upload Verification Document
method: POST
url: '{{baseUrl}}/api/businesses/me/documents'
order: 4000
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{authToken}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "type": "TAX_CERTIFICATE",
      "fileUrl": "https://example.com/docs/tax-cert.pdf",
      "fileName": "tax-cert.pdf"
    }
